name: ai_management_system
description: "AI Management System — employee mobile app (GPS/QR/Face attendance, offline sync, leave, payroll)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  
  flutter_riverpod: ^2.5.1


  dio: ^5.5.0

 
  go_router: ^14.2.0

  
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5

  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  
  google_fonts: ^6.2.1

  
  path_provider: ^2.1.5

  
  geolocator: ^13.0.1

 
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0

  
  onnxruntime: ^1.4.1
  image: ^4.9.1

  
  mobile_scanner: ^6.0.2

  
  open_filex: ^4.5.0

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 23
  
  adaptive_icon_background: "#14304F"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
   
    - assets/models/w600k_mbf.onnx
