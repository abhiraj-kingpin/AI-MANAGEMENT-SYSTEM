name: Deploy

# Inert by default — every job below is gated on the `DEPLOY_ENABLED`
# repository variable, which doesn't exist until someone sets it. No Render
# or Vercel project is connected to this repository from this environment
# (that requires a human with account access to create them and paste the
# resulting deploy-hook URLs into GitHub's Secrets settings); this workflow
# is the wiring for that day, not a claim that it's already deployed
# anywhere. See docs/architecture/09-deployment-architecture.md §3.
#
# To activate once Render/Vercel projects exist:
#   1. Repo Settings → Secrets and variables → Actions → Variables:
#      add DEPLOY_ENABLED = true
#   2. Same page → Secrets: add RENDER_DEPLOY_HOOK_URL and/or
#      VERCEL_DEPLOY_HOOK_URL (from each platform's dashboard)

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-admin-dashboard:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
