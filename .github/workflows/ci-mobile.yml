name: CI — Mobile App

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/ci-mobile.yml'

defaults:
  run:
    working-directory: mobile-app

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # `flutter build apk` is deliberately not run here: this repository
      # has never had the one-time `flutter create .` scaffolding step run
      # against it (see mobile-app/README.md) — the android/ and ios/
      # platform folders a real build needs don't exist yet. `analyze` and
      # `test` don't need those folders, so they're real, useful checks on
      # their own; a build step would just fail for a reason unrelated to
      # code quality until that one-time step happens.
      #
      # Worth stating plainly: this workflow is this codebase's first-ever
      # machine verification of the hand-written Dart in lib/ — it was
      # authored and reviewed without a local Flutter SDK available. Expect
      # its first real run to surface issues, not to pass cleanly by luck.
