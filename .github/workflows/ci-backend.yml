name: CI — Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    # Scoped to this job only, not the whole workflow — docker-build below
    # needs to run from the repo root, since its build context path
    # (./backend) is relative to the runner's working directory. A
    # workflow-level `defaults.run.working-directory` would have applied to
    # both jobs and silently resolved that path to backend/backend, which
    # doesn't exist — exactly the bug this comment is here to prevent
    # reintroducing.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Was '20'. npm test aborts with SIGABRT (exit 134) inside
          # onnxruntime-node's native init path as soon as the
          # face-recognition tests load their first real model.
          # Bumped to 22 on the hypothesis this was the same failure class
          # as the ci-admin.yml fix (Node 20 too old for a native
          # dependency) — that hypothesis was WRONG, the crash reproduces
          # identically on 22. Left at 22 anyway since >=22 is correct
          # regardless (package.json#engines), but the real cause is still
          # open — see the diagnostic step below.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      # Jest sets NODE_ENV=test automatically, which points src/config/env.ts
      # at .env.test (dummy values, committed — see that file) instead of a
      # real .env. No live MongoDB, no secrets: every test in this suite
      # mocks its own models (see README.md#testing).
      #
      # TEMPORARY DIAGNOSTIC (reinstated): the Node 20->22 bump didn't fix
      # the SIGABRT, so it isn't a Node-ABI issue. Re-capturing the crash
      # trace to see if it changed at all under Node 22.
      - name: npm test (diagnostic)
        run: |
          set +e
          npm test > test-output.log 2>&1
          EXIT_CODE=$?
          echo "npm test exit code: $EXIT_CODE"
          cat test-output.log
          grep -E "PASS|FAIL|RUNS|^[0-9]+: |Aborted|exit code|Fatal|terminate|what\(\)|abi::|Segmentation|malloc|corrupted|double free" test-output.log | tail -n 9 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $EXIT_CODE

      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build-only, no push/registry — this just proves the Dockerfile that
      # deploy.yml's Render hook depends on still actually builds, catching
      # a broken Dockerfile before it's discovered on a real deploy.
      - run: docker build -t ai-management-system-backend:ci ./backend
