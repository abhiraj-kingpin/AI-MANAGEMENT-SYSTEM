name: CI — Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    # Scoped to this job only, not the whole workflow — docker-build below
    # needs to run from the repo root, since its build context path
    # (./backend) is relative to the runner's working directory. A
    # workflow-level `defaults.run.working-directory` would have applied to
    # both jobs and silently resolved that path to backend/backend, which
    # doesn't exist — exactly the bug this comment is here to prevent
    # reintroducing.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      # Jest sets NODE_ENV=test automatically, which points src/config/env.ts
      # at .env.test (dummy values, committed — see that file) instead of a
      # real .env. No live MongoDB, no secrets: every test in this suite
      # mocks its own models (see README.md#testing).
      #
      # TEMPORARY DIAGNOSTIC: `npm test` is exiting 134 (SIGABRT) on this
      # runner only (608/608 pass locally). The normal annotations API only
      # surfaces GitHub's own "exit code 134" note, not the actual npm/jest
      # output, so this re-emits the real stdout+stderr as ::error:: lines
      # to get it into the annotations API. Remove once root-caused.
      - name: npm test (diagnostic)
        run: |
          set +e
          npm test > test-output.log 2>&1
          EXIT_CODE=$?
          echo "npm test exit code: $EXIT_CODE"
          cat test-output.log
          # GitHub's ::error:: workflow command only creates ~9-10
          # annotations per step, first-come-first-served. A plain tail
          # got us the native abort's stack trace (frames 1-4, in
          # onnxruntime-node's initOrt/session-handler init path) but cut
          # off before showing which test file was running or whether
          # there's a native error message above it. Grep for the
          # informative lines across the WHOLE log instead, keeping the
          # last ~9 matches so it's still weighted toward the crash point.
          grep -E "PASS|FAIL|RUNS|^[0-9]+: |Aborted|exit code|Fatal|terminate|what\(\)|abi::|Segmentation|malloc|corrupted|double free" test-output.log | tail -n 9 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $EXIT_CODE

      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build-only, no push/registry — this just proves the Dockerfile that
      # deploy.yml's Render hook depends on still actually builds, catching
      # a broken Dockerfile before it's discovered on a real deploy.
      - run: docker build -t ai-management-system-backend:ci ./backend
