name: CI — Admin Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/ci-admin.yml'
  pull_request:
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/ci-admin.yml'

defaults:
  run:
    working-directory: admin-dashboard

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

      # No `npm test` step here, deliberately — admin-dashboard has no test
      # suite yet (see admin-dashboard/README.md's Status section). Running
      # a script that doesn't exist, or one that runs nothing, would just be
      # a green checkmark that means nothing; this workflow only claims what
      # it actually checks.
