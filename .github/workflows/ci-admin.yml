name: CI — Admin Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/ci-admin.yml'
  pull_request:
    paths:
      - 'admin-dashboard/**'
      - '.github/workflows/ci-admin.yml'

defaults:
  run:
    working-directory: admin-dashboard

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Vitest + React Testing Library — covers real, non-presentational
      # logic: RBAC gating (`hasRole`, and Sidebar's actual role-based nav
      # visibility, rendered against the real store rather than a mocked
      # one), the axios-error-message extraction every mutation in the app
      # relies on, and the reduced-motion count-up hook's deterministic
      # branches. See admin-dashboard/README.md's Status section.
      - run: npm test
      - run: npm run build
